---
# SofiOS: toglie dal sistema installato i componenti del "sistema dal vivo". Senza internet e senza elenco dei pacchetti
# l'originale falliva (codice 100) se anche uno solo dei pacchetti non c'era: qui ogni pacchetto e' un'operazione a parte
# e un'eventuale assenza non ferma l'installazione.
backend: apt
update_db: false
skip_if_no_internet: false
operations:
  - try_remove: [live-boot]
  - try_remove: [live-boot-doc]
  - try_remove: [live-config]
  - try_remove: [live-config-doc]
  - try_remove: [live-config-systemd]
  - try_remove: [live-tools]
  - try_remove: [live-task-localisation]
  - try_remove: [live-task-recommended]
  - try_remove: [calamares-settings-debian]
