name: Android (compila e prova sul tablet simulato)
on:
  workflow_dispatch:
  push:
    branches: ['android/**']
    paths: ['android/**', '.github/workflows/android.yml', '!android/prove/**']
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Collaudi della Cassaforte contro la libreria del computer
        continue-on-error: true
        run: |
          mkdir -p /tmp/prove
          pip install pykeepass argon2-cffi 2>&1 | tail -1
          python3 android/tools/fixture-kdbx.py android/app/build/fixture 2>&1 | tee /tmp/prove/collaudi-fixture.txt
          # i comandi di Sofi: le risposte del programma del computer, per confrontarle
          git fetch --depth=1 origin claude/jolly-davinci-ltzvwz 2>&1 | tail -1 || true
          mkdir -p /tmp/pc && git show origin/claude/jolly-davinci-ltzvwz:live/config/includes.chroot_after_packages/usr/local/lib/sofios/mascotte_comandi.py > /tmp/pc/mascotte_comandi.py \
            && python3 -I android/tools/fixture-comandi.py /tmp/pc/mascotte_comandi.py android/app/build/fixture/comandi.tsv 2>&1 | tee -a /tmp/prove/collaudi-fixture.txt || echo "senza confronto con i comandi del computer" | tee -a /tmp/prove/collaudi-fixture.txt
          # l'unione delle cassaforti: il programma del computer e il tablet devono dare lo stesso risultato
          git show origin/claude/jolly-davinci-ltzvwz:live/config/includes.chroot_after_packages/usr/local/lib/sofios/cassaforte_unione.py > /tmp/pc/cassaforte_unione.py \
            && python3 android/tools/fixture-unione.py /tmp/pc/cassaforte_unione.py android/app/build/fixture 2>&1 | tee -a /tmp/prove/collaudi-fixture.txt || echo "senza confronto con l'unione del computer" | tee -a /tmp/prove/collaudi-fixture.txt
          # un Syncthing vero, solo per provare il dialogo della pagina «Dispositivi»
          bash android/tools/syncthing-di-prova.sh
          export SOFIOS_SYNCTHING_PORTA=8384 SOFIOS_SYNCTHING_CHIAVE="$(cat /tmp/st/chiave)"
          cd android && ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee /tmp/prove/collaudi-kotlin.txt
          cp /tmp/st/log.txt /tmp/prove/syncthing-di-prova.txt 2>/dev/null || true
          pkill syncthing || true
          cd .. && python3 android/tools/verifica-unione.py /tmp/pc/cassaforte_unione.py android/app/build/fixture 2>&1 | tee -a /tmp/prove/collaudi-python.txt
          for n in kotlin-nuovo kotlin-da-pc; do
            python3 android/tools/verifica-kdbx.py android/app/build/fixture/$n.kdbx "$(cat android/app/build/fixture/$n.kdbx.password)" android/app/build/fixture/$n.kdbx.attese.tsv 2>&1 | tee -a /tmp/prove/collaudi-python.txt
          done
      - name: Compila l'app
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug 2>&1 | tee /tmp/compila.txt
      - name: Abilita l'emulazione veloce (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Tablet simulato (Pixel Tablet, Android 14) e schermate vere
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/tools/prova-emulatore.sh android/app/build/outputs/apk/debug/app-debug.apk android/finto-fully/build/outputs/apk/debug/finto-fully-debug.apk /tmp/prove android/app/build/fixture/pc-predefinita.kdbx
      - name: Il programma del computer legge la cassaforte fatta da Android
        if: always()
        continue-on-error: true
        run: |
          pip install pykeepass 2>&1 | tail -1
          if [ -f /tmp/prove/cassaforte-da-android.kdbx ]; then
            python3 android/tools/verifica-kdbx.py /tmp/prove/cassaforte-da-android.kdbx prova-android-1 /tmp/prove/cassaforte-attese.tsv 2>&1 | tee -a /tmp/prove/collaudi-python.txt
          else echo "manca il file della cassaforte fatto da Android" | tee -a /tmp/prove/collaudi-python.txt; fi
      - name: Salva schermate e registro nel ramo
        if: always()
        env:
          BR: ${{ github.ref_name }}
        run: |
          mkdir -p /tmp/prove && cp /tmp/compila.txt /tmp/prove/ 2>/dev/null || true
          rm -f /tmp/prove/cassaforte-da-android.kdbx
          echo "esecuzione ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}, esito job: ${{ job.status }}" > /tmp/prove/esecuzione.txt
          rm -rf android/prove && mkdir -p android/prove && cp -r /tmp/prove/. android/prove/
          # File da installare sul tablet (versione di prova, firmata con la chiave di prova)
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            mkdir -p android/apk && cp android/app/build/outputs/apk/debug/app-debug.apk android/apk/SofiOS-prova.apk
            (cd android/apk && sha256sum SofiOS-prova.apk > SofiOS-prova.sha256)
            git add -f android/apk
          fi
          git config user.name "sofios-build" && git config user.email "build@sofios.local"
          git add android/prove && git commit -q -m "Android: schermate vere della prova ${GITHUB_RUN_ID} [skip ci]"
          for i in 1 2 3 4; do git pull -q --rebase origin "$BR" && git push -q origin "HEAD:$BR" && break; sleep 5; done
