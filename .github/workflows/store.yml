name: Prova SoStore
on:
  push:
    branches: [store-prova]
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 40
    steps:
      - name: Pacchetti
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git ca-certificates python3 python3-pyqt6 python3-gi gir1.2-appstream-1.0 appstream \
            packagekit packagekit-tools polkitd dbus locales gpg gpgv dirmngr fonts-inter breeze-icon-theme hicolor-icon-theme imagemagick >/dev/null
          sed -i 's/^# *it_IT.UTF-8/it_IT.UTF-8/' /etc/locale.gen && locale-gen >/dev/null
          cp live/config/includes.chroot_after_packages/etc/apt/apt.conf.d/60sofios-icone-programmi /etc/apt/apt.conf.d/ 2>/dev/null || true
          apt-get update -qq   # scarica anche il catalogo dei programmi (AppStream) e le icone
          appstreamcli refresh-cache --force | tail -2
          ls /var/lib/swcatalog/icons 2>/dev/null | head; ls /var/lib/swcatalog/yaml 2>/dev/null | head
      - uses: actions/checkout@v4
      - name: Icone del catalogo
        run: |
          cp live/config/includes.chroot_after_packages/etc/apt/apt.conf.d/60sofios-icone-programmi /etc/apt/apt.conf.d/
          apt-get update -qq; mkdir -p /tmp/out; { ls -la /var/lib/apt/lists | grep -i icons; ls -R /var/lib/swcatalog 2>&1 | head -10; for t in /var/lib/apt/lists/*icons*.tar.gz; do echo "$t"; tar tzf "$t" | head -3; done; } > /tmp/out/icone.txt 2>&1
      - name: Controllo pacchetti della vetrina
        run: |
          for p in $(python3 -c "import json;print(' '.join(a['pacchetto'] for a in json.load(open('live/config/includes.chroot_after_packages/usr/share/sofios/store/catalogo.json'))['vetrina']))"); do
            c=$(apt-cache policy "$p" | awk '/Candidate/{print $2}'); echo "$p -> ${c:-MANCA}"
          done
      - name: Schermate
        run: |
          mkdir -p /run/dbus /tmp/out; dbus-daemon --system --fork; sleep 1
          I=live/config/includes.chroot_after_packages
          export LANG=it_IT.UTF-8 LC_ALL=it_IT.UTF-8 QT_QPA_PLATFORM=offscreen SOFIOS_LIB=$PWD/$I/usr/local/lib/sofios SOFIOS_LOGO=$PWD/$I/usr/share/sofios/logo.png \
                 SOFIOS_CATALOGO=$PWD/$I/usr/share/sofios/store/catalogo.json SOFIOS_TEMA_ICONE=breeze-dark XDG_RUNTIME_DIR=/tmp/run
          mkdir -p /tmp/run; chmod 700 /tmp/run
          python3 -c "
          import gi; gi.require_version('AppStream','1.0'); from gi.repository import AppStream as A
          p=A.Pool(); p.load(); r=p.search('foto'); print('risultati AppStream per foto:', r.get_size() if hasattr(r,'get_size') else len(r))"
          { ls -d /var/lib/swcatalog/icons/*/* /usr/share/swcatalog/icons/*/* /var/lib/app-info/icons/*/* 2>/dev/null | head -20
            python3 -c "
          import gi; gi.require_version('AppStream','1.0'); from gi.repository import AppStream as A
          p=A.Pool(); p.load()
          for c in p.search('gimp').as_array()[:3]:
              print(c.get_id(), c.get_pkgname(), c.get_origin(), [(i.get_kind(), i.get_name(), i.get_filename(), i.get_url(), i.get_width()) for i in c.get_icons()])"
            python3 -c "from PyQt6.QtNetwork import QSslSocket; print('ssl', QSslSocket.supportsSsl(), QSslSocket.sslLibraryVersionString())"
            python3 -c "
          import gi; gi.require_version('AppStream','1.0'); from gi.repository import AppStream as A
          p=A.Pool(); p.load(); b=p.get_components(); print('componenti', b.get_size() if hasattr(b,'get_size') else len(b))"
            ls /var/lib/apt/lists | grep -i -E "icon|dep11|Components" | head; cat /etc/apt/apt.conf.d/*appstream* 2>&1 | head -40
            apt-get install -y -qq curl >/dev/null; curl -sSI "https://appstream.debian.org/media/trixie/org/gimp/GIMP/81aa8be6edc018b9d60a2f0cd75bd113/icons/128x128/gimp_gimp.png" | head -12
          } > /tmp/out/diagnosi.txt 2>&1
          SOFIOS_FOTO=/tmp/out/store.png SOFIOS_CERCA="foto" SOFIOS_DETTAGLIO=gimp SOFIOS_INSTALLA=kpat timeout 900 python3 $I/usr/local/bin/sofios-store > /tmp/out/programma.txt 2>&1 || true
          ls -la /tmp/out; dpkg -l kpat 2>&1 | tail -1
      - name: Android (catalogo F-Droid firmato)
        run: |
          I=live/config/includes.chroot_after_packages
          export GNUPGHOME=/tmp/gpg; mkdir -p $GNUPGHOME; chmod 700 $GNUPGHOME
          gpg --batch --keyserver hkps://keyserver.ubuntu.com --recv-keys 37D2C98789D8311948394E3E41E7044E1DBA2E89 > /tmp/out/chiave.txt 2>&1 || true
          gpg --batch --fingerprint 37D2C98789D8311948394E3E41E7044E1DBA2E89 >> /tmp/out/chiave.txt 2>&1
          gpg --batch --export 37D2C98789D8311948394E3E41E7044E1DBA2E89 > /tmp/out/fdroid.gpg
          export LANG=it_IT.UTF-8 LC_ALL=it_IT.UTF-8 QT_QPA_PLATFORM=offscreen SOFIOS_LIB=$PWD/$I/usr/local/lib/sofios SOFIOS_LOGO=$PWD/$I/usr/share/sofios/logo.png \
                 SOFIOS_CATALOGO=$PWD/$I/usr/share/sofios/store/catalogo.json SOFIOS_TEMA_ICONE=breeze-dark XDG_RUNTIME_DIR=/tmp/run SOFIOS_FDROID_CHIAVE=/tmp/out/fdroid.gpg
          SOFIOS_FOTO=/tmp/out/and.png SOFIOS_ANDROID_FINTO=da_attivare SOFIOS_ANDROID_FOTO=1 timeout 120 python3 $I/usr/local/bin/sofios-store > /tmp/out/android1.txt 2>&1 || true
          SOFIOS_FOTO=/tmp/out/andp.png SOFIOS_ANDROID_FINTO=pronto:GAPPS SOFIOS_ANDROID_FOTO=1 SOFIOS_CERCA_ANDROID=mappe timeout 600 python3 $I/usr/local/bin/sofios-store > /tmp/out/android2.txt 2>&1 || true
          ls -la ~/.cache/sofios-store/android/ >> /tmp/out/android2.txt 2>&1
          python3 - >> /tmp/out/android2.txt 2>&1 <<'PY'
          import sys, os, urllib.request
          sys.path.insert(0, os.environ["SOFIOS_LIB"]); import store_android as A
          c = A.CatalogoAndroid(); print("caricato", c.carica(), "app compatibili", len(c.app))
          a = [x for x in c.cerca("organic maps")][:1] or c.app[:1]
          a = a[0]; print("prova", a["pacchetto"], a["apk"])
          f = "/tmp/prova.apk"; urllib.request.urlretrieve(a["apk"], f)
          print("sha256 corrisponde:", A.sha256_file(f) == a["sha256"], os.path.getsize(f))
          open(f, "r+b").write(b"X"); print("file alterato riconosciuto:", A.sha256_file(f) != a["sha256"])
          PY
      - name: Windows (Wine)
        run: |
          dpkg --add-architecture i386 && apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq wine wine64 wine32:i386 xvfb xauth imagemagick x11-utils >/dev/null 2>&1 || true
          I=live/config/includes.chroot_after_packages
          export LANG=it_IT.UTF-8 LC_ALL=it_IT.UTF-8 SOFIOS_LIB=$PWD/$I/usr/local/lib/sofios SOFIOS_LOGO=$PWD/$I/usr/share/sofios/logo.png \
                 SOFIOS_CATALOGO=$PWD/$I/usr/share/sofios/store/catalogo.json SOFIOS_TEMA_ICONE=breeze-dark XDG_RUNTIME_DIR=/tmp/run
          Xvfb :7 -screen 0 1280x800x24 & sleep 2; export DISPLAY=:7
          { wine --version; } > /tmp/out/windows.txt 2>&1
          SOFIOS_FOTO=/tmp/out/win.png SOFIOS_WINDOWS_FOTO=win-notepadplusplus QT_QPA_PLATFORM=offscreen timeout 900 python3 $I/usr/local/bin/sofios-store >> /tmp/out/windows.txt 2>&1 || true
          { echo ---LOG; cat ~/.cache/sofios-store/windows/ultimo.log; ls -la ~/.cache/sofios-store/windows/; echo ---C; ls "$HOME/.wine/drive_c" "$HOME/.wine/drive_c/Program Files"; } >> /tmp/out/windows.txt 2>&1 || true
          ls -la "$HOME/.wine/drive_c/Program Files/Notepad++/" >> /tmp/out/windows.txt 2>&1
          # il programma Windows aperto davvero
          WINEDEBUG=-all wine "$HOME/.wine/drive_c/Program Files/Notepad++/notepad++.exe" >/dev/null 2>&1 & sleep 25
          import -window root /tmp/out/win-aperto.png 2>>/tmp/out/windows.txt || true
      - name: Salva
        if: always()
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/sc && cd /tmp/sc && cp -r /tmp/out ./foto 2>/dev/null || true
          git init -q && git checkout -q -b store-foto && git config user.name sofios-build && git config user.email build@sofios.local
          git add . && git commit -q -m "SoStore ${GITHUB_RUN_ID}" && git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" store-foto
