name: Info installatore
on:
  push:
    branches: [completo]
    paths: ['.github/workflows/calamares-info.yml']
permissions:
  contents: write
jobs:
  info:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 20
    steps:
      - name: Informazioni
        run: |
          apt-get update -qq && apt-get install -y -qq calamares calamares-settings-debian git >/dev/null 2>&1
          { dpkg -l calamares | tail -1; ls /usr/lib/x86_64-linux-gnu/calamares/modules/ /usr/lib/calamares/modules/ 2>&1
            echo ---SETTINGS; cat /etc/calamares/settings.conf
            echo ---MODULI; ls /etc/calamares/modules/ /usr/share/calamares/modules/ 2>&1
            echo ---CONTEXTUAL; cat /usr/share/calamares/modules/contextualprocess.conf 2>&1
            echo ---CHOOSER; cat /usr/share/calamares/modules/packagechooser.conf 2>&1
            echo ---PACKAGES; cat /etc/calamares/modules/packages.conf 2>&1 | grep -v "^#" | grep -v "^$"
            echo ---UNPACKFS; cat /etc/calamares/modules/unpackfs.conf 2>&1 | grep -v "^#" | grep -v "^$"
            echo ---SHELLPROCESS; cat /usr/share/calamares/modules/shellprocess.conf 2>&1 | grep -v "^$" | head -40
            echo ---REMOVE; cat /etc/calamares/modules/removeuser.conf 2>&1; } > /tmp/info.txt 2>&1
          cd /tmp && git clone -q --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} r && cd r
          git config user.email a@b; git config user.name ci; git checkout -q --orphan informazioni; git rm -rfq . ; mkdir i; cp /tmp/info.txt i/; git add i; git commit -qm "info"; git push -qf origin informazioni
