name: Info installatore
on:
  push:
    branches: [completo]
    paths: ['.github/workflows/calamares-info.yml']
permissions:
  contents: write
jobs:
  info:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 20
    steps:
      - name: Informazioni
        run: |
          mkdir -p /tmp/out
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git ca-certificates calamares calamares-settings-debian > /tmp/out/apt.txt 2>&1 || true
          { dpkg -L calamares | grep -i -E "packagechooser|contextualprocess|shellprocess|usersq|users/|welcome" | head -60
            for f in $(dpkg -L calamares | grep -E "(packagechooser|contextualprocess|shellprocess)\.conf$"); do echo "=== $f"; cat $f; done
            echo "=== users.conf"; cat /etc/calamares/modules/users.conf | grep -v "^ *#" | grep -v "^$"
            echo "=== finished"; cat /etc/calamares/modules/finished.conf; } > /tmp/out/info.txt 2>&1 || true
      - name: Salva
        if: always()
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/sc && cd /tmp/sc && cp -r /tmp/out ./i 2>/dev/null || true
          git init -q && git checkout -q -b informazioni && git config user.name ci && git config user.email ci@x
          git add . && git commit -q -m "info ${GITHUB_RUN_ID}" && git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" informazioni
