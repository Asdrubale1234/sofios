name: Installazione di prova
on:
  workflow_dispatch:
    inputs:
      livello:
        description: base | android | windows | completo
        default: base
permissions:
  contents: write
jobs:
  installa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Scarica l'ultima ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          mkdir -p iso && gh release download "$TAG" -D iso
          cat iso/sofios.iso.part* > sofios.iso && rm -rf iso/sofios.iso.part*
          echo "$TAG" > tag.txt
      - name: Installa nella macchina virtuale
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf imagemagick btrfs-progs
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          mkdir -p out
          python3 tools/installa-iso.py sofios.iso out/foto 55 "${{ inputs.livello }}"
      - name: Guarda dentro il sistema installato
        if: always()
        run: |
          {
          qemu-img convert -O raw /tmp/disco.qcow2 /tmp/disco.raw
          L=$(sudo losetup -fP --show /tmp/disco.raw); echo "loop $L"
          sudo lsblk -f $L
          i=0
          for part in ${L}p*; do
            i=$((i+1)); m=/mnt/p$i; sudo mkdir -p $m
            sudo mount -o ro $part $m 2>&1 || { echo "non montabile: $part"; continue; }
            echo "=== $part"; sudo ls $m | head -30
            R=$m; [ -d $m/@ ] && R=$m/@
            [ -f $R/etc/fstab ] || continue
            echo "--- fstab"; sudo cat $R/etc/fstab
            echo "--- sofios-livello.log"; sudo cat $R/var/log/sofios-livello.log 2>&1 | tail -40
            echo "--- pacchetti"; for p in wine wine64 waydroid unattended-upgrades snapper firefox-esr; do sudo grep -A8 "^Package: $p$" $R/var/lib/dpkg/status | grep -m1 "^Status" | sed "s/^/$p: /" || true; done
            echo "--- apt"; sudo ls $R/etc/apt/apt.conf.d | grep -i sofios
            echo "--- snapper"; sudo ls $R/etc/snapper/configs 2>&1
            echo "--- utenti"; sudo grep sofios-prova $R/etc/passwd
            echo "--- subvolumi"; sudo btrfs subvolume list $m 2>&1 | head
            echo "--- script bootloader"; sudo cat $R/usr/share/calamares/helpers/calamares-bootloader-config 2>&1 | head -120
            echo "--- pacchetti live rimasti"; sudo grep -A8 -E "^Package: (live-|calamares)" $R/var/lib/dpkg/status | grep -E "^Package|^Status" | paste - - | head -20
            echo "--- GRUB: ESP (p1) tutta"; sudo find /mnt/p1 | head -40
            for f in $(sudo find /mnt/p1 -name grub.cfg 2>/dev/null); do echo "--- $f"; sudo cat $f; done
            echo "--- @/boot/grub"; sudo ls -la $R/boot/grub | head -20
            echo "--- grub.cfg (primo pezzo)"; sudo head -40 $R/boot/grub/grub.cfg 2>&1
            echo "--- default grub"; sudo cat $R/etc/default/grub | grep -v "^#" | grep -v "^$"
            echo "--- apt history"; sudo tail -30 $m/@log/apt/history.log 2>&1
            echo "--- apt term.log (fine)"; sudo tail -60 $m/@log/apt/term.log 2>&1
            echo "--- log"; sudo ls $m/@log | head -30; sudo ls $R/boot $R/boot/efi 2>&1 | head -20
          done
          } > out/dentro.txt 2>&1 || true
      - name: Aggiunta in seguito di Windows e Android (come da SoStore)
        if: always()
        run: |
          {
          M=/mnt/agg; sudo mkdir -p $M
          sudo umount /mnt/p* 2>/dev/null || true
          L=$(sudo losetup -j /tmp/disco.raw | cut -d: -f1 | head -1); echo "loop $L"
          sudo mount -o rw,subvol=@ ${L}p2 $M 2>&1 || { echo "non montabile"; exit 0; }
          sudo mount -o rw ${L}p1 $M/boot/efi 2>/dev/null || true
          for d in dev proc sys; do sudo mount --bind /$d $M/$d; done
          sudo cp /etc/resolv.conf $M/etc/resolv.conf
          echo "--- sorgenti apt"; sudo cat $M/etc/apt/sources.list $M/etc/apt/sources.list.d/* 2>&1 | grep -v "^#" | head -30
          for p in wine waydroid; do echo "prima: $p: $(sudo chroot $M dpkg-query -W -f='${db:Status-Status}' $p 2>&1)"; done
          sudo chroot $M apt-get update 2>&1 | tail -5
          echo "--- installo wine (come SoStore)"; sudo chroot $M apt-get install -y wine wine64 fonts-wine 2>&1 | tail -15
          echo "--- installo waydroid (come SoStore)"; sudo chroot $M apt-get install -y waydroid 2>&1 | tail -15
          for p in wine wine64 waydroid; do echo "dopo: $p: $(sudo chroot $M dpkg-query -W -f='${db:Status-Status} ${Version}' $p 2>&1)"; done
          for d in dev proc sys; do sudo umount $M/$d; done
          sudo umount $M/boot/efi 2>/dev/null; sudo umount $M
          } > out/aggiunta.txt 2>&1 || true
      - name: Avvia il sistema installato
        if: always()
        run: |
          sudo umount /mnt/p* 2>/dev/null || true; sudo losetup -D || true
          mkdir -p out/avvio
          [ -f /tmp/disco.qcow2 ] && python3 tools/avvia-disco.py none out/avvio 10 || true
      - name: Salva
        if: always()
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/sc && cd /tmp/sc
          cp -r "$GITHUB_WORKSPACE/out/foto" ./foto 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/out/dentro.txt" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/out/aggiunta.txt" . 2>/dev/null || true
          cp -r "$GITHUB_WORKSPACE/out/avvio" ./avvio 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/tag.txt" . 2>/dev/null || true
          git init -q && git checkout -q -b "installazione-${{ inputs.livello }}"
          git config user.name sofios-build && git config user.email build@sofios.local
          git add . && git commit -q -m "Installazione ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "installazione-${{ inputs.livello }}"
