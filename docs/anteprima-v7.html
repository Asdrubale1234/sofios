<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SofiOS Desktop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* Concept: il mare notturno di SofiOS. Nuovo: il faro gira davvero all'avvio, il desktop e' vuoto, tutto parte dalla cartella Applicazioni e dal tasto destro. Il browser e' volutamente chiaro, in stile macOS. */
:root{
  --sea-0:#06111c; --sea-1:#0b1f33; --sea-2:#12304c; --glass:rgba(12,28,46,.82); --line:rgba(180,210,235,.16);
  --ink:#e8f1f8; --dim:#9db4c7; --beam:#ffd479; --beam-soft:rgba(255,212,121,.16); --ok:#6fe0b0; --bad:#ff8a80;
  --display:"Sora","Trebuchet MS",sans-serif; --body:"Hanken Grotesk","Segoe UI",system-ui,sans-serif;
  color-scheme:dark; box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--sea-0);color:var(--ink);font:14px/1.4 var(--body);overflow:hidden}
button{font:inherit;color:inherit}
.screen{position:relative;height:100%;overflow:hidden;background:radial-gradient(120% 90% at 70% 0%,var(--sea-2),var(--sea-1) 45%,var(--sea-0))}
.sweep{position:absolute;top:-10%;right:18%;width:140%;height:34%;transform-origin:100% 50%;background:linear-gradient(270deg,rgba(255,212,121,.22),rgba(255,212,121,0) 70%);clip-path:polygon(100% 45%,0 0,0 100%,100% 55%);pointer-events:none;animation:sweep 9s ease-in-out infinite alternate}
@keyframes sweep{from{transform:rotate(-8deg)}to{transform:rotate(14deg)}}
/* avvio */
#boot{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--sea-0);transition:opacity .7s}
#boot.done{opacity:0;pointer-events:none}
.lh{position:relative;width:84px}
.lh svg{display:block;width:84px;height:auto;position:relative;z-index:2}
.rot{position:absolute;left:50%;top:29px;width:640px;height:640px;margin:-320px 0 0 -320px;z-index:1;border-radius:50%;
  background:conic-gradient(from 80deg,rgba(255,212,121,.42) 0deg,rgba(255,212,121,0) 26deg,rgba(255,212,121,0) 180deg,rgba(255,212,121,.42) 180deg,rgba(255,212,121,0) 206deg);
  -webkit-mask-image:radial-gradient(circle,#000 0,transparent 68%);mask-image:radial-gradient(circle,#000 0,transparent 68%);animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lamp{position:absolute;left:50%;top:29px;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--beam);box-shadow:0 0 18px 6px rgba(255,212,121,.6);z-index:3}
.word{font:700 30px var(--display);letter-spacing:.04em;z-index:2}.word span{color:var(--beam)}
.bar{width:min(220px,60vw);height:3px;border-radius:2px;background:var(--line);overflow:hidden;z-index:2}
.bar i{display:block;height:100%;width:0;background:var(--beam);transition:width 4s ease-in-out}
.hint{font-size:12px;color:var(--dim);z-index:2}
.replay{position:absolute;bottom:14px;left:max(12px,env(safe-area-inset-left,0px));z-index:30;opacity:.8;border:1px solid var(--line);background:var(--glass);border-radius:9px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
.replay:hover,.replay:focus-visible{border-color:var(--beam);outline:none}
/* desktop */
#desk{position:absolute;inset:0}
.task{position:absolute;left:0;right:0;bottom:0;z-index:40;height:0;pointer-events:none}
.dock{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:flex-end;gap:10px;padding:8px 12px;border-radius:22px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);box-shadow:0 12px 40px rgba(0,0,0,.4);pointer-events:auto}
.di{position:relative;width:48px;height:48px;border:0;border-radius:12px;display:grid;place-items:center;color:#fff;cursor:pointer;transition:transform .15s;transform-origin:50% 100%;padding:0}
.di svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.di:hover,.di:focus-visible{transform:scale(1.3) translateY(-4px);outline:none;z-index:2}
.di.on::after{content:"";position:absolute;bottom:-6px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ink)}
.di[data-tip]:hover::before{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) scale(.77);white-space:nowrap;background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:12px;color:var(--ink)}
.i-apps{background:linear-gradient(145deg,#ffd479,#e0a63a);color:#06111c}.i-calc{background:linear-gradient(145deg,#5a6b7c,#2c3a48)}.i-chat{background:linear-gradient(145deg,#4fd1a0,#1f9d77)}.i-web{background:linear-gradient(145deg,#59a8ff,#2a63d6)}.i-files{background:linear-gradient(145deg,#f2c26b,#c98a2b);color:#06111c}
.tray{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;padding:4px 6px 4px 4px;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums;pointer-events:auto}
.wifi{width:34px;height:34px;border:0;border-radius:10px;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.wifi:hover,.wifi:focus-visible,.wifi[aria-expanded=true]{background:var(--beam-soft);outline:none}
.wifi svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wifi.off{color:var(--dim)}
#wpanel{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:70px;z-index:60;width:min(340px,calc(100% - 24px));max-height:calc(100% - 100px);overflow:auto;background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(18px);box-shadow:0 24px 60px rgba(0,0,0,.5);padding:14px;display:flex;flex-direction:column;gap:12px}
#wpanel h3{margin:0;font:700 15px var(--display)}
.wrow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.sw{position:relative;width:42px;height:24px;border-radius:12px;border:0;background:var(--line);cursor:pointer;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked=true]{background:var(--ok)}.sw[aria-checked=true]::after{left:21px}
.nets{display:flex;flex-direction:column;gap:2px}
.net{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:8px;border-radius:9px;cursor:pointer;text-align:left}
.net:hover,.net:focus-visible{background:var(--beam-soft);outline:none}
.net b{flex:1;font-weight:500}.net small{color:var(--dim);font-size:12px}.net .ok{color:var(--ok)}
.pw{display:flex;gap:8px}.pw input{flex:1;min-width:0;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:inherit}
.pw button,.wlink{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:7px 12px;font:600 13px var(--body);cursor:pointer}
.pw button:hover,.wlink:hover{border-color:var(--beam);background:var(--beam-soft)}
.det{font-size:13px;color:var(--dim);display:grid;grid-template-columns:auto 1fr;gap:3px 12px}.det span:nth-child(odd){color:var(--dim)}.det span:nth-child(even){color:var(--ink);text-align:right}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px}
.i-photos{background:linear-gradient(145deg,#ff9a8b,#c850c0 55%,#4158d0)}
.ph{display:flex;flex-direction:column;gap:10px;min-height:0}
.ph .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ph .top h3{margin:0;font:700 15px var(--display);flex:1}
.ph .day{font-size:12px;font-weight:600;color:var(--dim);margin:6px 0 4px;text-transform:uppercase;letter-spacing:.05em}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:3px}
.th{aspect-ratio:1;border:0;padding:0;border-radius:4px;cursor:pointer;position:relative}
.th:hover,.th:focus-visible{outline:2px solid var(--beam)}
.th.new::after{content:"nuova";position:absolute;left:4px;top:4px;font-size:10px;font-weight:700;background:var(--beam);color:#06111c;border-radius:6px;padding:0 5px}
.pv{display:flex;flex-direction:column;gap:10px}
.pv .big{aspect-ratio:4/3;border-radius:12px;width:100%}
.pv .bar2{display:flex;gap:8px;align-items:center}.pv .bar2 b{flex:1;font-size:14px}
.info{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:12px}
.info span:nth-child(odd){color:var(--dim)}.info span:nth-child(even){text-align:right}
.info .map{grid-column:1/-1;height:70px;border-radius:8px;background:repeating-linear-gradient(45deg,#16324a 0 10px,#1a3a56 10px 20px);display:grid;place-items:center;color:var(--beam);font-size:12px}
.qr{display:grid;gap:8px;justify-items:center;text-align:center;font-size:13px;color:var(--dim);padding:10px}
.qr i{width:96px;height:96px;border-radius:8px;background:conic-gradient(#fff 25%,#06111c 0 50%,#fff 0 75%,#06111c 0) 0 0/24px 24px}
.clk{border:0;background:transparent;color:var(--ink);font:inherit;padding:6px 8px;border-radius:10px;cursor:pointer;font-variant-numeric:tabular-nums}
.clk:hover,.clk:focus-visible,.clk[aria-expanded=true]{background:var(--beam-soft);outline:none}
#cpanel{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:70px;z-index:60;width:min(320px,calc(100% - 24px));background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(18px);box-shadow:0 24px 60px rgba(0,0,0,.5);padding:14px;display:flex;flex-direction:column;gap:10px}
#cpanel .dd{font:700 15px var(--display);text-transform:capitalize}
.cnav{display:flex;align-items:center;gap:6px}.cnav b{flex:1;text-align:center;text-transform:capitalize;font-size:14px}
.cnav button{border:0;background:transparent;color:var(--ink);font-size:18px;border-radius:8px;width:32px;height:32px;cursor:pointer}.cnav button:hover,.cnav button:focus-visible{background:var(--beam-soft);outline:none}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:13px}
.cg .h{color:var(--dim);font-size:11px;font-weight:600;padding:4px 0;text-transform:uppercase}
.cg .d{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;border:0;background:transparent;color:var(--ink);font:inherit;cursor:default;padding:0}
.cg .d.o{color:var(--dim);opacity:.5}.cg .d.we{color:#ff9d9d}.cg .d.fe{color:#ff9d9d;font-weight:700}.cg .d.t{background:var(--beam);color:#06111c;font-weight:700}
.cfe{font-size:12px;color:#ff9d9d;min-height:16px}
#cpanel .wlink{align-self:flex-start}
.hintdesk{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);color:var(--dim);font-size:13px;text-align:center;pointer-events:none;opacity:.8}
/* finestre */
.win{position:absolute;z-index:10;display:flex;flex-direction:column;min-width:0;background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(0,0,0,.45);overflow:hidden}
.wbar{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:grab;user-select:none;touch-action:none}
.wbar h2{margin:0;flex:1;font:700 14px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc{display:flex;gap:2px}.wb{border:0;background:transparent;color:var(--dim);font-size:16px;line-height:1;padding:2px 8px;border-radius:8px;cursor:pointer}.wb:hover,.wb:focus-visible{background:var(--beam-soft);color:var(--ink);outline:none}.win.min{display:none}.win.max{left:0!important;top:0!important;right:auto;width:100%!important;max-height:none!important;height:calc(100% - 96px);border-radius:0}.win.max .wbody{flex:1;min-height:0;overflow:auto}
.x{border:0;background:transparent;color:var(--dim);font-size:20px;line-height:1;padding:2px 8px;border-radius:8px;cursor:pointer}
.x:hover,.x:focus-visible{background:var(--beam-soft);color:var(--ink);outline:none}
.wbody{padding:12px;overflow:auto;min-height:0;flex:1}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:0;border-radius:12px;background:transparent;cursor:pointer;font-weight:500;font-size:13px;text-align:center}
.app:hover,.app:focus-visible{background:rgba(255,255,255,.06);outline:1px solid var(--line)}
.app .g{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.06);border:1px solid var(--line);display:grid;place-items:center;font:700 19px var(--display);color:var(--beam)}
.app.soon{opacity:.5;cursor:default}
/* file */
.path{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--dim);margin-bottom:8px}
.path b{color:var(--ink)}
.files{display:flex;flex-direction:column;gap:2px;min-height:210px;border-radius:10px;padding:4px 4px 72px;border:1px dashed transparent}
.files:hover{border-color:var(--line)}
.f{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:default;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.f:hover,.f.sel{background:rgba(255,255,255,.07)}
.f .ic{width:26px;height:22px;border-radius:5px;display:grid;place-items:center;font:700 10px var(--display);background:var(--beam-soft);color:var(--beam);flex:none}
.f .ic.dir{background:var(--beam);color:var(--sea-0)}
.f .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f .s{font-size:12px;color:var(--dim)}
.f input{flex:1;min-width:0;background:var(--sea-0);color:var(--ink);border:1px solid var(--beam);border-radius:6px;padding:3px 6px;font:inherit}
.tip{margin:8px 2px 0;font-size:12px;color:var(--dim)}
/* menu tasto destro */
#ctx{position:fixed;z-index:200;min-width:210px;background:#0f2438;border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
#ctx button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 12px;border-radius:7px;font-size:13px;cursor:pointer}
#ctx button:hover,#ctx button:focus-visible{background:var(--beam-soft);outline:none}
#ctx hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
#ctx .bad{color:var(--bad)}
#toast{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);z-index:150;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:7px 14px;font-size:13px;max-width:calc(100% - 32px);text-align:center}
/* calcolatrice */
.calc{display:grid;gap:8px;width:230px;margin:0 auto}
.disp{background:var(--sea-0);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:right;font:500 24px var(--display);min-height:50px;overflow:hidden;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keys button{padding:11px 0;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.04);cursor:pointer;font-weight:600;font-size:15px}
.keys button:hover,.keys button:focus-visible{border-color:var(--beam);outline:none}
.keys .op{color:var(--beam)}.keys .eq{background:var(--beam);color:var(--sea-0);border-color:transparent}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.m.me{align-self:flex-end;background:var(--beam-soft);border-color:rgba(255,212,121,.4)}
.m small{display:block;color:var(--dim);font-size:11px}
.send{display:flex;gap:8px;margin-top:6px}
.send input{flex:1;min-width:0;background:var(--sea-0);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit}
.btn{border:1px solid var(--line);background:transparent;border-radius:9px;padding:7px 12px;font-weight:600;cursor:pointer}
.btn:hover,.btn:focus-visible{border-color:var(--beam);background:var(--beam-soft);outline:none}
/* browser stile macOS: volutamente chiaro */
.win.mac{background:#f5f5f7;color:#1d1d1f;border:1px solid #d1d1d6;border-radius:12px;backdrop-filter:none}
.mac .wbar{background:linear-gradient(#ececee,#e1e1e4);border-bottom:1px solid #cfcfd4;cursor:grab;gap:12px}
.mac .wb,.mac .x{color:#3a3a3c}.mac .wb:hover,.mac .x:hover{background:rgba(0,0,0,.08);color:#000}.lights{display:flex;gap:8px}
.lights i,.lights button{width:12px;height:12px;border-radius:50%;display:block}
.lights .r{background:#ff5f57}.lights .y{background:#febc2e}.lights .gr{background:#28c840}
.lights .y,.lights .gr{border:0;padding:0;cursor:pointer}.lights button{border:0;padding:0;width:12px;height:12px;border-radius:50%;cursor:pointer}
.addr{flex:1;min-width:0;background:#fff;border:1px solid #cfcfd4;border-radius:8px;padding:5px 12px;font-size:13px;text-align:center;color:#3a3a3c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mac .wbody{background:#fff;color:#1d1d1f;padding:28px 18px;display:grid;place-items:center;text-align:center}
.mac .wbody h3{margin:0 0 10px;font:700 22px var(--display)}
.mac .wbody input{background:#f2f2f5;color:#1d1d1f;width:min(360px,100%);padding:10px 14px;border-radius:999px;border:1px solid #cfcfd4;font:inherit}
.mac .wbody p{color:#6e6e73;font-size:13px;margin:12px 0 0}
@media (max-width:1120px) and (min-width:641px){.dock{bottom:68px}}
@media (max-width:640px){.dock{bottom:68px;gap:8px;padding:8px 10px}#wpanel{bottom:62px}.win{left:8px!important;right:8px;width:auto!important;top:46px!important;max-height:calc(100% - 210px)}.wbar{cursor:default}}
@media (prefers-reduced-motion:reduce){.rot,.sweep{animation:none}.bar i{transition:none}}
.screen{background:var(--wall,radial-gradient(120% 90% at 70% 0%,var(--sea-2),var(--sea-1) 45%,var(--sea-0)))}
:root.light{--sea-0:#eaf2f9;--sea-1:#d6e6f3;--sea-2:#bcd7ec;--glass:rgba(255,255,255,.82);--line:rgba(20,50,80,.2);--ink:#0b1f33;--dim:#46607a;--beam:#e0a63a;--beam-soft:rgba(224,166,58,.2);color-scheme:light}
.light #ctx{background:#fff}.light .dock,.light .tray{box-shadow:0 8px 30px rgba(20,50,80,.2)}
.tray{gap:2px;padding:3px 6px 3px 3px}.wifi{position:relative}
.wifi[data-n]::after{content:attr(data-n);position:absolute;top:1px;right:0;min-width:15px;height:15px;border-radius:8px;background:#ff6b5e;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.dsep{width:1px;align-self:stretch;margin:4px 2px;background:var(--line)}
.i-set{background:linear-gradient(145deg,#8e9aa8,#566270)}.i-trash{background:linear-gradient(145deg,#6c7a89,#3b4756)}.i-trash.full{background:linear-gradient(145deg,#ff9a8b,#c0504a)}
#npanel,#ctlpanel,#pmenu{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:70px;z-index:60;width:min(340px,calc(100% - 24px));max-height:calc(100% - 100px);overflow:auto;background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(18px);box-shadow:0 24px 60px rgba(0,0,0,.5);padding:14px;display:flex;flex-direction:column;gap:10px}
#pmenu{width:min(240px,calc(100% - 24px));padding:8px;gap:0}
#npanel h3,#ctlpanel h3{margin:0;font:700 15px var(--display)}
.nit{display:flex;flex-direction:column;gap:2px;padding:9px 10px;border-radius:10px;background:rgba(127,160,190,.12);font-size:13px}.nit b{font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
.sel{background:rgba(127,160,190,.14);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;max-width:60%}.sel option{color:#000}
.rng{flex:1;max-width:60%;accent-color:var(--beam)}
.sec{font-size:12px;color:var(--dim);margin:2px 0}
.set{display:grid;grid-template-columns:150px 1fr;gap:12px;min-height:300px}
.snav{display:flex;flex-direction:column;gap:2px}.sn{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13px}.sn:hover,.sn:focus-visible{background:var(--beam-soft);outline:none}.sn.on{background:var(--beam-soft);font-weight:700}

/* ---- Stile Apple: icone sfumate, angoli morbidi, varianti A/B ---- */
:root{--wr:22px}
.win{border-radius:var(--wr)}
#wpanel,#cpanel,#npanel,#ctlpanel,#pmenu{border-radius:20px}

 box-shadow:inset 0 0 0 .6px rgba(255,255,255,.35),inset 0 16px 14px -12px rgba(255,255,255,.6),inset 0 -10px 12px -8px rgba(0,0,0,.22),0 4px 10px rgba(0,0,0,.32),0 1px 2px rgba(0,0,0,.3)}

function openTerm(){
  const t=el("div","term"),out=el("div"),pr=el("div","pr");pr.append(el("span","u","luca@sofios:~$"));const i=el("input");i.setAttribute("aria-label","Comando");i.autocomplete="off";i.spellcheck=false;pr.append(i);t.append(out,pr);
  const say=s=>{const d=el("div","o",s);out.append(d)};
  const run=c=>{const [cmd,...a]=c.trim().split(/\s+/);const arg=a.join(" ");
    if(!cmd)return;
    if(cmd==="help")say("Comandi: help, ls, pwd, whoami, date, uname -a, echo, clear, nmcli device wifi list, exit");
    else if(cmd==="ls")say(FS.map(f=>f.t==="dir"?f.n+"/":f.n).join("  "));
    else if(cmd==="pwd")say("/home/luca");
    else if(cmd==="whoami")say("luca");
    else if(cmd==="date"){const d=new Date();say(GGL[d.getDay()]+" "+d.getDate()+" "+MESI[d.getMonth()]+" "+d.getFullYear()+", "+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds()))}
    else if(cmd==="uname")say("Linux sofios 6.12 x86_64 GNU/Linux");
    else if(cmd==="echo")say(arg);
    else if(cmd==="clear")out.textContent="";
    else if(cmd==="nmcli"&&arg==="device wifi list")say(WF.nets.map(n=>(n[0]===WF.cur?"* ":"  ")+n[0]+"  "+bars(n[1])).join("\n"));
    else if(cmd==="exit")closeWin("term");
    else say(cmd+": comando non trovato");};
  i.onkeydown=e=>{if(e.key==="Enter"){const v=i.value;out.append(el("div","o","luca@sofios:~$ "+v));run(v);i.value="";t.scrollTop=t.scrollHeight}};
  t.onclick=()=>i.focus();say("SofiOS · anteprima del terminale. Scrivi help.");makeWin("term","Terminale",innerWidth>640?170:8,50,520,t);setTimeout(()=>i.focus(),0)}
